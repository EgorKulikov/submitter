[package]
name = "submitter"
version = "0.1.0"
edition = "2021"
description = "Submit solutions to online judges from the command line"
license = "MIT"
repository = "https://github.com/EgorKulikov/submitter"

[package.metadata.deb]
maintainer = "Egor Kulikov <egor@egork.net>"
section = "utils"
priority = "optional"
extended-description = "Submit solutions to AtCoder, Codeforces, CodeChef, Yandex Contest, UOJ, UCup, Toph, Kattis, Eolymp, Luogu, CodeRun, KEP.uz directly from the command line."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11.1"
dialoguer = "0.11"
crossterm = "0.28"
open = { version = "5.3", features = ["shellexecute-on-windows"] }
rand = "0.8.5"
rs_sha512 = "0.1"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json", "cookies", "gzip", "deflate"] }
clipboard = "0.5"
md-5 = "0.10"
hmac = "0.12"

scraper = "0.22"
dirs = "6"
